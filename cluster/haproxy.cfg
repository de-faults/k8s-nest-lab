# Plays the role of an AWS NLB: TCP pass-through to every worker node, with
# health checks, so stopping a worker ("AZ outage") just removes a target.
global
  log stdout format raw local0

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s

# Docker's embedded DNS; lets HAProxy start even if a worker is down.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend http
  bind :80
  default_backend workers-http

frontend https
  bind :443
  default_backend workers-https

backend workers-http
  balance roundrobin
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server worker-1a worker-1a:80
  server worker-1b worker-1b:80
  server worker-1c worker-1c:80

backend workers-https
  balance roundrobin
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server worker-1a worker-1a:443
  server worker-1b worker-1b:443
  server worker-1c worker-1c:443

# "Target group" view: http://localhost:8404
frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
