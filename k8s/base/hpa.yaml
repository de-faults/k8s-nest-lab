apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nest-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nest-lab
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Default is 300s; shortened so the lab sees scale-down within minutes.
    scaleDown:
      stabilizationWindowSeconds: 60
