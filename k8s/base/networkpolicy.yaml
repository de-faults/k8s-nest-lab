# Zero-trust default: nothing may reach pods in this namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ...except the ingress controller, and pods explicitly labelled as clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-lab-allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-lab
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              nest-lab-client: "true"
      ports:
        - port: http
